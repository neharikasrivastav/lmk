name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit -p .
      - run: bun run test

  # Live companion evals against Gemini. Runs when the agent changes or on demand, and
  # skips itself if the GEMINI_API_KEY repository secret isn't set.
  evals:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Check whether the agent changed
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || git diff --name-only HEAD~1 HEAD | grep -qE '^(src/lib/ai/|src/lib/companion-|evals/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: oven-sh/setup-bun@v2
        if: steps.changed.outputs.run == 'true' && env.GEMINI_API_KEY != ''
      - if: steps.changed.outputs.run == 'true' && env.GEMINI_API_KEY != ''
        run: bun install --frozen-lockfile && bun run eval
